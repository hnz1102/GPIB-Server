<!DOCTYPE html><html lang="ja"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title data-ja="GPIB スペクトラム表示">GPIB Spectrum View</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#111827;color:#e2e8f0;font-family:'Segoe UI',Arial,sans-serif;height:100vh;display:flex;flex-direction:column}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 14px;background:#1e2d45;border-bottom:1px solid #243b55}
.toolbar h1{font-size:1em;color:#93c5fd;margin-right:auto;letter-spacing:.05em}
.toolbar label{font-size:.78em;color:#94a3b8;display:flex;align-items:center;gap:4px}
.toolbar input[type=number]{width:56px;padding:5px 6px;background:#0f172a;border:1px solid #2d4a6a;border-radius:6px;color:#e2e8f0}
button,.btn{padding:6px 12px;border-radius:6px;border:1px solid #2d4a6a;background:#0f172a;color:#e2e8f0;font-size:.85em;cursor:pointer;text-decoration:none;font-weight:600;user-select:none}
button:hover,.btn:hover{filter:brightness(1.25)}
button:active{transform:translateY(1px)}
#btn-start{background:#166534;border-color:#16a34a}
#btn-stop{background:#991b1b;border-color:#dc2626}
#btn-rec.on{background:#7f1d1d;border-color:#f87171;color:#fecaca}
.status{font-size:.78em;padding:3px 10px;border-radius:12px;font-weight:700}
.ok{background:#14532d;color:#4ade80}.off{background:#4c0519;color:#fb7185}.warn{background:#451a03;color:#fb923c}
.info{display:flex;flex-wrap:wrap;gap:4px 18px;padding:6px 14px;font-size:.82em;color:#cbd5e1;background:#16213a;border-bottom:1px solid #243b55}
.info b{color:#7dd3fc;font-weight:600}
#main{flex:1;display:flex;min-height:0}
#wrap{flex:1;position:relative;min-width:0;min-height:260px}
#cv{position:absolute;left:0;right:0;top:0;width:100%;height:100%;cursor:crosshair}
#cv2{position:absolute;left:0;right:0;width:100%;display:none;cursor:crosshair;border-top:1px solid #243b55}
#wf{position:absolute;left:0;right:0;bottom:0;width:100%;display:none;cursor:crosshair;border-top:1px solid #243b55}
#msg{position:absolute;left:70px;bottom:34px;font-size:.8em;color:#fca5a5;background:rgba(17,24,39,.85);padding:2px 6px;border-radius:4px}
#msg:empty{display:none}
/* ── front panel ── */
#panel{width:560px;flex-shrink:0;background:#1a2438;border-left:1px solid #243b55;padding:10px;display:flex;flex-direction:column;gap:9px;overflow-y:auto}
.top{display:flex;gap:10px;align-items:stretch}
.entry{flex:1;background:#0b1220;border:1px solid #2d4a6a;border-radius:8px;padding:8px 10px;min-height:84px}
.entry .name{font-size:.72em;color:#94a3b8;letter-spacing:.08em;text-transform:uppercase}
.entry .val{font-size:1.2em;color:#7dd3fc;font-weight:700;font-family:Consolas,monospace;margin-top:2px;word-break:break-all}
.entry .inp{font-size:1.05em;color:#fbbf24;font-family:Consolas,monospace;min-height:1.3em}
.entry .inp:not(:empty)::after{content:'_';animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:0}}
.knob{width:84px;display:flex;flex-direction:column;align-items:center;gap:2px}
#knob{width:84px;height:84px;cursor:grab;touch-action:none}
#knob:active{cursor:grabbing}
.knob span{font-size:.62em;color:#64748b;letter-spacing:.08em}
.sec{font-size:.68em;color:#64748b;letter-spacing:.1em;margin-bottom:-4px}
.grid{display:grid;gap:6px}
.hard{grid-template-columns:1fr 1fr}
.hard button{padding:9px 2px;font-size:.82em;background:#24324a}
.hard button.lit{background:#166534;border-color:#4ade80;color:#dcfce7}
.fkrow{display:flex;gap:10px;align-items:flex-start}
.fkcol{flex:1.15;display:flex;flex-direction:column;gap:6px;min-width:0}
.padcol{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.bigkeys{grid-template-columns:1fr 1fr}
.bigkeys button{padding:14px 4px;font-size:1em;font-weight:700;letter-spacing:.06em;background:#24324a;border-width:2px}
.bigkeys button.sel{background:#1d4ed8;border-color:#60a5fa}
.fkeys{grid-template-columns:repeat(3,1fr)}
.shdr{grid-column:1/-1;font-size:.66em;color:#93c5fd;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid #243b55;padding:4px 0 2px;margin-top:2px}
#result{background:#0b1220;border:1px solid #2d4a6a;border-radius:8px;padding:8px 10px;font-size:.8em}
#result .rrow{display:flex;justify-content:space-between;gap:10px;padding:2px 0;border-top:1px dashed #1f3352}
#result .rtab{width:100%;border-collapse:collapse;margin:2px 0 4px;font-family:Consolas,monospace;font-variant-numeric:tabular-nums}
#result .rtab th{color:#94a3b8;font-weight:600;font-family:'Segoe UI',Arial,sans-serif;font-size:.92em;text-align:right;padding:2px 6px;border-bottom:1px solid #2d4a6a;white-space:nowrap}
#result .rtab td{color:#7dd3fc;text-align:right;padding:1px 6px;white-space:nowrap}
#result .rtab td:first-child,#result .rtab th:first-child{color:#fde047;text-align:center;width:2.2em}
#result .rtab tr:nth-child(even) td{background:rgba(30,45,69,.45)}
#result .rrow.tab{flex-direction:column;gap:2px}
#result .rrow span{color:#94a3b8}#result .rrow b{color:#7dd3fc;font-weight:600;text-align:right;font-family:Consolas,monospace}
.fkeys button{padding:7px 1px;font-size:.7em;background:#24324a}
.fkeys button.sel{background:#1d4ed8;border-color:#60a5fa}
.soft{grid-template-columns:1fr 1fr}
.soft button{text-align:left;padding:6px 8px;min-height:42px;background:#1f2a3f;font-size:.78em}
.soft button .v{display:block;font-size:.85em;color:#7dd3fc;font-weight:500;margin-top:2px;font-family:Consolas,monospace}
.soft button.act{background:#7c2d12;border-color:#fb923c}
.soft button.on{border-color:#4ade80}
.soft button.on .v{color:#4ade80}
.pad{grid-template-columns:repeat(4,1fr)}
.pad button{padding:10px 0;font-size:1.05em;font-family:Consolas,monospace}
.pad .unit{background:#3b2a63;border-color:#7c3aed;font-size:.82em}
.pad .unit:disabled{opacity:.3;cursor:default;filter:none}
.pad .step{background:#24324a}
/* peak list panel */
#pkl{background:#0b1220;border:1px solid #2d4a6a;border-radius:8px;padding:8px 10px;font-size:.8em}
#pkl .phdr{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px}
#pkl .phdr .sec{margin:0 auto 0 0}
#pkl .phdr button{padding:4px 9px;font-size:.92em;background:#1f2a3f}
#pkl .phdr button.sel{background:#a16207;border-color:#fde047;color:#fef9c3}
#pkl .phdr select{padding:3px 4px;background:#0f172a;border:1px solid #2d4a6a;border-radius:6px;color:#e2e8f0;font-size:.95em}
#pkl .phdr label{display:flex;align-items:center;gap:3px;color:#94a3b8;white-space:nowrap}
#pl-thu{display:inline-block;min-width:8.5em}
#pkl .phdr input[type=number]{padding:3px 4px;background:#0f172a;border:1px solid #2d4a6a;border-radius:6px;color:#e2e8f0;font-size:.95em}
#pkl table{width:100%;table-layout:fixed;border-collapse:collapse;font-family:Consolas,monospace;font-variant-numeric:tabular-nums}
#pkl th{color:#94a3b8;font-weight:600;font-family:'Segoe UI',Arial,sans-serif;font-size:.92em;text-align:right;padding:2px 6px;border-bottom:1px solid #2d4a6a;white-space:nowrap}
#pkl td{color:#7dd3fc;text-align:right;padding:2px 6px;white-space:nowrap}
#pkl td:first-child,#pkl th:first-child{color:#fde047;text-align:center;width:2.2em}
#pkl tbody tr{cursor:pointer;height:20px}
#pkl tbody tr.pad{cursor:default}
#pkl tbody tr.pad:hover td{background:inherit}
#pkl .pscroll{overflow-y:auto}
#pkl thead th{position:sticky;top:0;background:#0b1220}
#pkl td{line-height:16px}
#pkl tbody tr:nth-child(even) td{background:rgba(30,45,69,.45)}
#pkl tbody tr:hover td,#pkl tbody tr.hl td{background:#3f3a12}
#pkl .pnote{color:#64748b;margin-top:4px}
@media (max-width:1100px){#panel{width:480px}}
@media (max-width:900px){#main{flex-direction:column}#panel{width:auto;border-left:none;border-top:1px solid #243b55}#wrap{min-height:320px}}
@media (max-width:520px){.fkrow{flex-direction:column}.fkcol,.padcol{width:100%}}
</style></head><body>
<div class="toolbar">
  <h1>&#x1F4C8; <span data-ja="スペクトラム表示">Spectrum View</span> <span style="color:#64748b;font-size:.8em">ADVANTEST R3267 via GPIB</span></h1>
  <span id="lang-slot"></span>
  <label data-help="GPIB address of the R3267 (0-30).&#10;Must match the GPIB address set on the instrument." data-help-ja="R3267 の GPIB アドレス（0〜30）。&#10;本体の GPIB アドレス設定と合わせてください。">ADDR <input id="addr" type="number" min="0" max="30" value="{{ADDR}}"></label>
  <button id="btn-start" data-help="Start capturing the trace with the R3267's current settings.&#10;(Switches to DL2 and repeats TS + TBA?)" data-help-ja="R3267 の現在の設定のまま波形の取り込みを開始します。&#10;（DL2 に切り替え、TS + TBA? を繰り返し）"><span data-ja="&#x25B6; 開始">&#x25B6; Start</span></button>
  <button id="btn-stop" data-help="Stop capturing and restore the R3267 delimiter to DL0.&#10;Also aborts an operation that is stuck waiting for a reply." data-help-ja="取り込みを停止し、R3267 の区切り文字を DL0 に戻します。&#10;応答待ちで止まっている処理も中断します。"><span data-ja="&#x25A0; 停止">&#x25A0; Stop</span></button>
  <label data-help="Hold the maximum of each point in the browser (orange line).&#10;Independent of the R3267's own Max Hold (TRACE A)." data-help-ja="ブラウザ側で各点の最大値を保持してオレンジ線で表示します。&#10;R3267 本体の Max Hold（TRACE A）とは別機能です。"><input id="maxhold" type="checkbox"> <span data-ja="Max hold（ブラウザ）">Max hold (browser)</span></label>
  <button id="btn-clear" data-help="Clear the browser's max hold." data-help-ja="ブラウザ側の Max hold 表示をクリアします。" data-ja="hold クリア">Clear hold</button>
  <label data-help="Waterfall: show the history of trace A below the spectrum (colour = level, newest row at the top)." data-help-ja="ウォーターフォール: スペクトラムの下にトレース A の履歴を表示します（色 = レベル、最新が一番上）。"><input id="wfon" type="checkbox"> <span data-ja="ウォーターフォール">Waterfall</span></label>
  <label data-help="Waterfall colour range.&#10;Auto: fitted to the data (noise floor … highest level, follows changes smoothly).&#10;Ref range: reference level … bottom of the screen (same as the spectrum)." data-help-ja="ウォーターフォールの色範囲。&#10;自動: データに合わせて調整（ノイズフロア〜最大レベル、変化に滑らかに追従）。&#10;基準範囲: 基準レベル〜画面下端（スペクトラムと同じ）。"><span data-ja="色">Colour</span>
    <select id="wfmode" style="padding:4px 6px;background:#0f172a;border:1px solid #2d4a6a;border-radius:6px;color:#e2e8f0">
      <option value="auto" data-ja="自動">Auto</option><option value="ref" data-ja="基準範囲">Ref range</option></select></label>
  <button id="btn-wfclr" data-help="Clear the waterfall history." data-help-ja="ウォーターフォールの履歴を消去します。" data-ja="WF クリア">Clear WF</button>
  <button id="btn-csv" data-help="Save the current traces as CSV (A, B, max hold, lower screen),&#10;with the settings, marker, XY cursor and peak list in the header lines (#)." data-help-ja="現在の波形を CSV で保存します（A・B・Max hold・分割時の下画面）。&#10;先頭の # 行に設定値・マーカ・XY カーソル・ピークリストを記録します。">&#x2B07; CSV</button>
  <button id="btn-png" data-help="Save the graph as a PNG image (spectrum, lower screen and waterfall as shown, with the settings)." data-help-ja="グラフを PNG 画像で保存します（表示中のスペクトラム・下画面・ウォーターフォールと設定値）。">&#x2B07; PNG</button>
  <button id="btn-rec" data-help="Record every trace-A frame while capturing.&#10;Press again to stop: the recording is saved as CSV (one row per frame: time + levels).&#10;Stops and saves by itself when the frequency axis or level scale changes,&#10;or after 20000 frames." data-help-ja="取り込み中のトレース A を毎フレーム記録します。&#10;もう一度押すと停止し、CSV で保存します（1 行 = 1 フレーム: 時刻 + 各点のレベル）。&#10;周波数軸・レベル軸が変わったとき、または 20000 フレームで自動的に停止・保存します。">&#x25CF; REC</button>
  <span id="run" class="status off" data-ja="停止中">Stopped</span>
  <span id="conn" class="status off">WS --</span>
  <a href="/" class="btn" style="background:#374151" data-ja="&#x2190; メインメニュー">&#x2190; Main menu</a>
</div>
<div class="info">
  <span>CF <b id="i-cf">--</b></span><span>SPAN <b id="i-span">--</b></span><span>RBW <b id="i-rbw">--</b></span>
  <span>VBW <b id="i-vbw">--</b></span><span>SWP <b id="i-swt">--</b></span><span>ATT <b id="i-att">--</b></span>
  <span>REF <b id="i-rl">--</b></span><span>SCALE <b id="i-dd">--</b></span><span>TRACE <b id="i-tr">--</b></span>
  <span>PEAK <b id="i-pk">--</b></span><span>MKR <b id="i-mk">--</b></span><span>CURSOR <b id="i-cur">--</b></span><span>RATE <b id="i-fps">--</b></span>
</div>
<div id="main">
  <div id="wrap" data-help="Trace display.&#10;Green: trace A, magenta: trace B, orange dashed: display line,&#10;cyan ◆: instrument marker, red ▼: peak, yellow numbered ▼: peak list (MKR → Peak List),&#10;white dotted lines: XY cursor, orange ⊕: its anchor (TRACE A → XY Cursor).&#10;Click: move the marker to that frequency (MK)&#10;Wheel: fine-adjust the active function (jog)" data-help-ja="波形表示。&#10;緑: トレース A、マゼンタ: トレース B、オレンジ破線: ディスプレイライン、&#10;水色◆: 本体マーカ、赤▼: ピーク、黄色の番号付き▼: ピークリスト（MKR → Peak List）、&#10;白い点線: XY カーソル、オレンジの⊕: そのアンカー（TRACE A → XY Cursor）。&#10;クリック: その周波数にマーカを移動（MK）&#10;ホイール: アクティブ項目を微調整（ジョグ）"><canvas id="cv"></canvas><canvas id="cv2" data-help="Lower screen of the WINDOW split display (Zoom / F/T / T/T).&#10;Both screens are read by switching SCRSEL, so the update rate drops to about 1 frame/s." data-help-ja="WINDOW 分割表示（Zoom / F/T / T/T）の下画面。&#10;SCRSEL を切り替えて両画面を読むため、更新は約 1 フレーム/秒に下がります。"></canvas><canvas id="wf" data-help="Waterfall: trace A history (colour = level, newest at the top). Hover: frequency / level / age. Click: move the marker. Wheel: jog." data-help-ja="ウォーターフォール: トレース A の履歴（色 = レベル、最新が上）。マウスオーバー: 周波数・レベル・経過時間、クリック: マーカ移動、ホイール: ジョグ。"></canvas><div id="msg"></div></div>
  <div id="panel">
    <div class="top">
      <div class="entry" id="entry" data-help="Active function display.&#10;Top: parameter being set, middle: current value, bottom: value being typed.&#10;Turning the mouse wheel here works like the jog dial." data-help-ja="アクティブファンクション表示。&#10;上: 設定中の項目、中: 現在値、下: テンキー入力中の値。&#10;ここでマウスホイールを回すとジョグダイアルと同じ動作になります。">
        <div class="name" id="af-name">--</div>
        <div class="val" id="af-val">--</div>
        <div class="inp" id="af-inp"></div>
      </div>
      <div class="knob"><canvas id="knob" width="168" height="168" data-help="Jog dial (like the data knob on the instrument).&#10;Turn it with the mouse wheel or by dragging to change the active function in fine steps.&#10;Hold Shift for coarse steps. The ← → keys also work." data-help-ja="ジョグダイアル（本体のデータノブ相当）。&#10;マウスホイール または ドラッグで回すと、アクティブ項目を細かいステップで変更します。&#10;Shift を押しながら回すと粗いステップになります。&#10;キーボードの ← → でも操作できます。"></canvas><span data-ja="ジョグダイアル">JOG DIAL</span></div>
    </div>
    <div class="grid hard">
      <button id="hk-repeat" data-help="REPEAT (continuous sweep).&#10;Sets the R3267 to continuous sweep (CONTS) and captures continuously." data-help-ja="REPEAT（連続掃引）。&#10;R3267 を連続掃引（CONTS）にし、ブラウザへの取り込みも連続で行います。">REPEAT</button>
      <button id="hk-single" data-help="SINGLE (single sweep).&#10;Each press takes and captures one sweep, then holds the display (SNGLS)." data-help-ja="SINGLE（単掃引）。&#10;押すたびに 1 回だけ掃引して取り込み、表示を保持します（SNGLS）。">SINGLE</button>
    </div>
    <div id="pkl" data-help="Peak list (R3267 PLS FREQ / LEVEL).&#10;Level: largest peak first; Freq: lowest frequency first.&#10;The R3267 searches once when the list is made; Auto re-search repeats PLS so the list follows the signal.&#10;Hover a row to highlight its marker, click it to move the instrument marker there." data-help-ja="ピークリスト（R3267 の PLS FREQ / LEVEL）。&#10;レベル順: 最大ピークから、周波数順: 低い周波数から。&#10;R3267 はリスト作成時に 1 回だけサーチします。自動再サーチで PLS を繰り返すと信号に追従します。&#10;行にマウスを乗せるとマーカを強調、クリックで本体のマーカをそこへ移動します。"></div>
    <div class="fkrow">
      <div class="fkcol">
        <div class="sec" data-ja="ファンクション">FUNCTION</div>
        <div class="grid bigkeys" id="bigkeys"></div>
        <div class="grid fkeys" id="fkeys"></div>
      </div>
      <div class="padcol">
        <div class="sec" data-ja="データ入力">DATA ENTRY</div>
        <div class="grid pad" id="pad"></div>
      </div>
    </div>
    <div class="sec" id="soft-title">SOFT KEYS</div>
    <div class="grid soft" id="soft"></div>
    <div id="result" style="display:none"></div>
  </div>
</div>
<script>
const TOKEN = '{{TOKEN}}';
const TOP = 14592, PER_DIV = 1280;          // R3267 raw scale (manual 5.2.10.3)
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
let meta = null, trace = null, traceB = null, meta2 = null, trace2 = null, mouseX2 = null, hold = null, ws = null, running = false;
let frames = [], mouseX = null;

// ── formatting ──────────────────────────────────────────────────────────────
function trimNum(x, d) { return (+x).toFixed(d).replace(/\.?0+$/, ''); }
function fmtHz(f) {
  if (f == null || !isFinite(f)) return '--';
  const a = Math.abs(f);
  if (a >= 1e9) return trimNum(f / 1e9, 6) + ' GHz';
  if (a >= 1e6) return trimNum(f / 1e6, 4) + ' MHz';
  if (a >= 1e3) return trimNum(f / 1e3, 3) + ' kHz';
  return trimNum(f, 1) + ' Hz';
}
// engineering format for linear units (W / V)
function fmtEng(v, u) {
  if (v == null || !isFinite(v)) return '--';
  const a = Math.abs(v);
  const [d, p] = a >= 1 ? [1, ''] : a >= 1e-3 ? [1e-3, 'm'] : a >= 1e-6 ? [1e-6, 'µ'] : a >= 1e-9 ? [1e-9, 'n'] : [1e-12, 'p'];
  return trimNum(v / d, 3) + ' ' + p + u;
}
function fmtTime(t) {
  if (t == null || !isFinite(t)) return '--';
  if (t >= 1) return trimNum(t, 3) + ' s';
  if (t >= 1e-3) return trimNum(t * 1e3, 3) + ' ms';
  return trimNum(t * 1e6, 3) + ' µs';
}
const FMT = {
  freq: fmtHz, time: fmtTime,
  level: v => v == null || !isFinite(v) ? '--' : lin(meta) ? fmtEng(v, unitName()) : trimNum(v, 2) + ' ' + unitName(),
  db: v => v == null || !isFinite(v) ? '--' : trimNum(v, 2) + ' dB',
  count: v => v == null || !isFinite(v) ? '--' : String(Math.round(v)),
  ratio: v => v == null || !isFinite(v) ? '--' : trimNum(v, 4),
};
// number → GPIB argument without exponent notation
function arg(v, unit) { return trimNum(v, 9) + unit; }
// TA?/TB?: low nibble = mode (Write/View/Blank/Normalize), high nibble = add-on
// (MaxHold/Average/MinHold/PowerAvg); e.g. 32 = 0x20 = Write + Average.
const lo = v => (v | 0) & 0x0F, hi = v => ((v | 0) >> 4) & 0x0F;
const TRMODE = ['Write', 'View', 'Blank', 'Normalize'], TRADD = ['', '+MaxHold', '+Avg', '+MinHold', '+PwrAvg'];
const DETN = ['Normal', 'Pos', 'Neg', 'Sample'];

// ── value step helpers (jog dial / ↑↓) ──────────────────────────────────────
function seq(v, dir, mant) {              // step through mant×10^n
  if (!(v > 0)) return mant[0];
  const e = Math.floor(Math.log10(v) + 1e-9), m = v / Math.pow(10, e);
  let i = mant.findIndex(x => Math.abs(x - m) < 1e-6);

function softHelp(s) {
  if (s.p) return P[s.p].name + ': ' + L(PARAM_HELP[s.p]) + '\n' +
    tr('Press to make it the active function; set it with numeric + unit keys, ↑↓ or the jog dial.',
       'このキーを押すと入力対象になります。テンキー＋単位キー、↑↓、ジョグダイアルで設定。') + '\n(GPIB: ' + s.p + ')';
  const code = typeof s.code === 'function' ? (meta ? s.code(meta) : s.lbl) : s.code;
  const base = (code || '').split(' ')[0];
  const h = L(SOFT_HELP[code] || SOFT_HELP[base]);
  return s.lbl + (h ? ': ' + h : '') + '\n(GPIB: ' + code + ')';
}

let curMenu = 'FREQ', active = 'CF', entry = '';

function buildPanel() {
  // FREQ / SPAN / LEVEL / COUPLE are the large main keys, the others go below them.
  const MAJOR = ['FREQ', 'SPAN', 'LEVEL', 'COUPLE'];
  const big = $('bigkeys'), fk = $('fkeys'); big.innerHTML = ''; fk.innerHTML = '';
  for (const name of Object.keys(MENUS)) {
    const b = document.createElement('button');
    b.textContent = name; b.className = name === curMenu ? 'sel' : '';
    b.dataset.help = L(FKEY_HELP[name]) || name;
    b.onclick = () => selectMenu(name);
    (MAJOR.includes(name) ? big : fk).appendChild(b);
  }
  const pad = $('pad'); pad.innerHTML = '';
  for (const k of ['7', '8', '9', 'BS', '4', '5', '6', '↑', '1', '2', '3', '↓', '0', '.', '-', 'CLR']) {
    const b = document.createElement('button');
    b.textContent = k === 'BS' ? '⌫' : k;
    if (k === '↑' || k === '↓') b.className = 'step';
    b.dataset.help = L(KEY_HELP[k]) || tr('Enter digit ' + k + '.', '数字 ' + k + ' を入力します。');
    b.onclick = () => keyPress(k);
    pad.appendChild(b);
  }
  for (let i = 0; i < 4; i++) {
    const b = document.createElement('button');
    b.className = 'unit'; b.id = 'unit' + i;
    b.onclick = () => unitPress(i);
    pad.appendChild(b);
  }
  renderSoft(); renderEntry();
}

function selectMenu(name) {
  curMenu = name;
  const firstParam = MENUS[name].find(s => s.p);
  active = firstParam ? firstParam.p : null;
  entry = '';
  document.querySelectorAll('#bigkeys button, #fkeys button').forEach(b => b.className = b.textContent === name ? 'sel' : '');
  // keep the graph overlays (peak list, ACP windows); drop the menu's results
  results = Object.fromEntries(Object.entries(results).filter(([k]) => k === 'PKLST?' || k === 'ACP?'));
  renderSoft(); renderEntry();
  requestState(); requestResults();
}

// Soft keys are built once per menu and then only updated in place: rebuilding
// the buttons every few seconds (state / meta refresh) would replace the element
// under the mouse and close its hover help.
let softBuiltFor = null;
function softValue(s) {
  if (s.p) return P[s.p].sq === null ? '' : FMT[kindOf(s.p)](pget(s.p, meta || {}));
  return meta && s.val ? (s.val(meta) || '') : '';
}
function renderSoft() {
  $('soft-title').textContent = tr('SOFT KEYS — ', 'ソフトキー — ') + curMenu;
  const sk = $('soft');
  if (softBuiltFor !== curMenu) {
    softBuiltFor = curMenu;
    sk.innerHTML = '';
    for (const s of MENUS[curMenu]) {
      if (s.hdr) {
        const h = document.createElement('div');
        h.className = 'shdr'; h.textContent = L(s.hdr);
        sk.appendChild(h); continue;
      }
      const b = document.createElement('button');
      b._soft = s;
      b.innerHTML = '<span class="l"></span><span class="v"></span>';
      b.onclick = () => {
        if (s.p) { active = s.p; entry = ''; renderSoft(); renderEntry(); return; }
        const code = typeof s.code === 'function' ? s.code(meta || {}) : s.code;
        if (!code) return;
        if (/^TRGSRC (VIDEO|EXT)/.test(code) && !confirm(tr(
            'Video / Ext trigger: without a trigger signal the R3267 waits and the trace freezes.\n' +
            'The capture then only reads the current trace (no TS). Switch back with "Trig Free Run".\n\nContinue?',
            'Video / Ext トリガ: トリガ信号がないと R3267 は掃引を待ち続け、波形が止まります。\n' +
            'その間の取り込みは現在のトレースの読み出しのみ（TS なし）になります。「Trig Free Run」で戻せます。\n\n続けますか？'))) return;
        if (s.cf && !confirm(L(s.cf) + '\n(GPIB: ' + code + ')')) return;
        sendKey(code);
      };
      sk.appendChild(b);
    }
  }
  // update labels, values, states and help text in place
  for (const b of sk.querySelectorAll('button')) {

  add('saved', isoLocal(new Date()));
  add('center_Hz', m.cf); add('span_Hz', m.span); add('start_Hz', m.fa); add('stop_Hz', m.fb);
  add('rbw_Hz', m.rbw); add('vbw_Hz', m.vbw); add('sweep_time_s', m.swt); add('attenuator_dB', m.att);
  add('ref_level_' + u, m.rl); add('scale', lin(m) ? 'linear' : m.ddiv + ' dB/div'); add('unit', u);
  add('points', m.npts);
  if (m.ta != null) add('trace_A', TRMODE[lo(m.ta)] + TRADD[hi(m.ta)]);
  if (m.tb != null) add('trace_B', TRMODE[lo(m.tb)] + TRADD[hi(m.tb)]);
  if (m.det != null) add('detector', DETN[m.det]);
  if (m.single) add('sweep', 'single');
  return L;
}
function extraLines() {
  const L = [], u = unitName(), xu = zeroSpan() ? 's' : 'Hz';
  const mi = markerIndex();
  if (meta.mkr && isFinite(meta.mkf)) L.push('# marker(x_' + xu + ';level_' + u + '),' + meta.mkf + (mi >= 0 && trace ? ',' + csvNum(trace[mi], meta) : ''));
  if (st['XYCSR?'] === '1') {
    const cx = stNum('CSRX?'), cy = stNum('CSRY?'), dx = stNum('CSRDX?'), dy = stNum('CSRDY?');
    if (cx != null && cy != null) L.push('# xy_cursor(x_' + xu + ';y_' + u + '),' + cx + ',' + cy);
    if (cx != null && cy != null && dx != null && dy != null)
      L.push('# xy_anchor(x_' + xu + ';y_' + u + ';dx;dy),' + (cx - dx) + ',' + (cy - dy) + ',' + dx + ',' + dy);
  }
  peaks().forEach((p, k) => L.push('# peak_' + (k + 1) + '(x_' + xu + ';level_' + u + '),' + p.x + ',' + p.y));
  return L;
}
function saveCSV() {
  if (!meta || !trace) { $('msg').textContent = tr('No trace to save yet.', 'まだ保存する波形がありません。'); return; }
  const n = trace.length, zs = zeroSpan(), u = unitName();
  const cols = [[zs ? 'time_s' : 'freq_Hz', i => zs ? ((meta.swt || 0) * i / (n - 1)).toPrecision(9) : String(Math.round(freqAt(i, n)))]];
  if (lo(meta.ta) !== 2) cols.push(['A_' + u, i => csvNum(trace[i], meta)]);
  if (traceB && lo(meta.tb) !== 2 && traceB.length === n) cols.push(['B_' + u, i => csvNum(traceB[i], meta)]);
  if ($('maxhold').checked && hold && hold.length === n) cols.push(['maxhold_' + u, i => csvNum(hold[i], meta)]);
  const L = ['# R3267 trace', ...settingsLines(meta), ...extraLines()];
  if (splitOn && meta2 && trace2 && trace2.length === n) {   // lower screen: its own X axis
    const m2 = meta2, z2 = m2.span === 0;
    L.push('# lower_screen,' + (SPLIT_NAME[meta.mltscr] || 'split'), '# lower_center_Hz,' + m2.cf, '# lower_span_Hz,' + m2.span,
           '# lower_sweep_time_s,' + m2.swt, '# lower_ref_level,' + m2.rl, '# lower_scale,' + (lin(m2) ? 'linear' : m2.ddiv + ' dB/div'));
    cols.push([z2 ? 'lower_time_s' : 'lower_freq_Hz', i => z2 ? ((m2.swt || 0) * i / (n - 1)).toPrecision(9) : String(Math.round(m2.fa + (m2.fb - m2.fa) * i / (n - 1)))]);
    cols.push(['lower_A', i => csvNum(trace2[i], m2)]);
  }
  L.push(cols.map(c => c[0]).join(','));
  for (let i = 0; i < n; i++) L.push(cols.map(c => c[1](i)).join(','));
  download('r3267_' + stamp() + '.csv', new Blob([L.join('\r\n') + '\r\n'], {type: 'text/csv'}));
}
function savePNG() {
  if (!meta) { $('msg').textContent = tr('No trace to save yet.', 'まだ保存する波形がありません。'); return; }
  resize();   // canvases sized and drawn for the current layout
  const d = window.devicePixelRatio || 1, wrapR = $('wrap').getBoundingClientRect();
  const parts = [cv, cv2, wf].filter(c => c.style.display !== 'none' && c.width > 1 && c.height > 1);
  const footH = 22, W = Math.round(wrapR.width * d), H = Math.round(wrapR.height * d) + Math.round(footH * d);
  const out = document.createElement('canvas'); out.width = W; out.height = H;
  const o = out.getContext('2d');
  o.fillStyle = '#111827'; o.fillRect(0, 0, W, H);
  for (const c of parts) { const r = c.getBoundingClientRect(); o.drawImage(c, Math.round((r.left - wrapR.left) * d), Math.round((r.top - wrapR.top) * d), c.width, c.height); }
  o.setTransform(d, 0, 0, d, 0, 0);
  o.fillStyle = '#94a3b8'; o.font = '12px sans-serif'; o.textAlign = 'left';
  o.fillText('R3267  ' + new Date().toLocaleString() + '   CF ' + fmtHz(meta.cf) + '  SPAN ' + fmtHz(meta.span) + '  RBW ' + fmtHz(meta.rbw) +
             '  VBW ' + fmtHz(meta.vbw) + '  SWP ' + fmtTime(meta.swt) + '  ATT ' + FMT.db(meta.att) + '  REF ' + FMT.level(meta.rl), 8, wrapR.height + 15);
  out.toBlob(b => download('r3267_' + stamp() + '.png', b), 'image/png');
}
// recording: every trace-A frame → one CSV row (time, elapsed, levels)
const REC_MAX = 20000;
let rec = null;
function recLabel() {
  const b = $('btn-rec');
  if (!rec) { b.textContent = '\u25CF REC'; b.className = ''; return; }
  const sec = Math.round(((rec.rows.length ? rec.rows[rec.rows.length - 1][0] : Date.now()) - rec.t0) / 1000);
  b.textContent = '\u25A0 REC ' + rec.rows.length + ' (' + Math.floor(sec / 60) + ':' + pad2(sec % 60) + ')'; b.className = 'on';
}
function recStart() {
  if (!meta) { $('msg').textContent = tr('Start the capture first.', '先に取り込みを開始してください。'); return; }
  rec = {meta: Object.assign({}, meta), zs: zeroSpan(), u: unitName(), t0: Date.now(), rows: []};
  recLabel();
  if (!running) $('msg').textContent = tr('Recording: waiting for frames (press Start).', '記録中: フレーム待ち（開始を押してください）。');
}
function recPush(t) {
  if (!rec) return;
  if (t.length !== rec.meta.npts) return;
  rec.rows.push([Date.now(), Float32Array.from(t)]);
  if (rec.rows.length >= REC_MAX) { recStop(tr('Recording reached ' + REC_MAX + ' frames and was saved.', '記録が ' + REC_MAX + ' フレームに達したため保存しました。')); return; }
  if (rec.rows.length % 4 === 1) recLabel();
}
function recAxisChanged() { if (rec && rec.rows.length) recStop(tr('Settings changed: the recording was saved.', '設定が変わったため、記録を保存しました。')); else if (rec) rec.meta = Object.assign({}, meta); }
function recStop(note) {
  const r = rec; rec = null; recLabel();
  if (!r || !r.rows.length) { $('msg').textContent = tr('Nothing was recorded.', '記録されたフレームがありません。'); return; }
  const m = r.meta, n = m.npts, xs = [];
  for (let i = 0; i < n; i++) xs.push(r.zs ? ((m.swt || 0) * i / (n - 1)).toPrecision(9) : String(Math.round(m.fa + (m.fb - m.fa) * i / (n - 1))));
  const L = ['# R3267 recording (trace A, one row per frame)', ...settingsLines(m),
             '# frames,' + r.rows.length, '# x_axis,' + (r.zs ? 'time_s' : 'freq_Hz'), 'time,elapsed_s,' + xs.join(',')];
  for (const [t, v] of r.rows) {
    let line = isoLocal(new Date(t)) + ',' + ((t - r.t0) / 1000).toFixed(3);
    for (let i = 0; i < n; i++) line += ',' + csvNum(v[i], m);
    L.push(line);
  }
  download('r3267_rec_' + stamp(new Date(r.t0)) + '.csv', new Blob([L.join('\r\n') + '\r\n'], {type: 'text/csv'}));
  if (note) $('msg').textContent = note;
}
$('btn-csv').onclick = saveCSV;
$('btn-png').onclick = savePNG;
$('btn-rec').onclick = () => rec ? recStop() : recStart();

// ── events ──────────────────────────────────────────────────────────────────
$('addr').addEventListener('change', () => {
  const v = +$('addr').value;
  if (!(v >= 0 && v <= 30)) return;
  authFetch('/api/gpib_addr', {method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'}, body: 'dev=sa&addr=' + encodeURIComponent($('addr').value)}).catch(function () {});
});
$('btn-start').onclick = () => { hold = null; send({cmd: 'start', addr: +$('addr').value}); };
$('btn-stop').onclick = () => send({cmd: 'stop'});
$('btn-clear').onclick = () => { hold = null; draw(); };
cv.addEventListener('mousemove', e => { mouseX = e.offsetX; draw(); });
cv.addEventListener('mouseleave', () => { mouseX = null; $('i-cur').textContent = '--'; draw(); });
// click on the trace (or the waterfall): move the instrument marker there
function clickMarker(offsetX, width) {
  if (!meta || !trace) return;
  const w = width - G.L - G.R, x = offsetX - G.L;
  if (x < 0 || x > w || (!zeroSpan() && meta.fb === meta.fa)) return;
  if (zeroSpan()) { sendKey('MK ' + arg((meta.swt || 0) * x / w, 'SC')); return; }   // time-domain marker
  sendKey('MK ' + arg(Math.round(meta.fa + (meta.fb - meta.fa) * x / w), 'HZ'));
}
cv.addEventListener('click', e => clickMarker(e.offsetX, cv.clientWidth));
// PC keyboard: digits, '.', '-', Backspace, Enter (default unit), Esc, arrows
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (/^[0-9]$/.test(e.key)) keyPress(e.key);
  else if (e.key === '.' || e.key === '-') keyPress(e.key);
  else if (e.key === 'Backspace') keyPress('BS');
  else if (e.key === 'Escape') keyPress('CLR');
  else if (e.key === 'Enter') enterDefault();
  else if (e.key === 'ArrowUp') stepActive(1, false, 1);
  else if (e.key === 'ArrowDown') stepActive(-1, false, 1);
  else if (e.key === 'ArrowRight') jog(1, false);
  else if (e.key === 'ArrowLeft') jog(-1, false);
  else return;
  e.preventDefault();
});
window.addEventListener('resize', resize);
// the graph area also changes when the info bar or toolbar wraps
if (window.ResizeObserver) { let rw = 0, rh = 0; new ResizeObserver(([e]) => {
  const {width, height} = e.contentRect; if (width !== rw || height !== rh) { rw = width; rh = height; resize(); } }).observe($('wrap')); }
buildPanel();
renderPeaks();
drawKnob();
$('wfon').checked = wfOn;
$('wfmode').value = wfMode;
resize();
connect();
</script>
